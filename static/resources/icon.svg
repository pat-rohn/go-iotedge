<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Outer hexagon (faint ring = coverage/signal) -->
  <polygon points="32,6 54,19 54,45 32,58 10,45 10,19"
           fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.4"/>

  <!-- Inner hexagon (device ring) -->
  <polygon points="32,18 44,25 44,39 32,46 20,39 20,25"
           fill="none" stroke="#60a5fa" stroke-width="1.5"/>

  <!-- Lines from center to inner hex vertices -->
  <line x1="32" y1="28"   x2="32" y2="18"   stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="35.9" y1="29.5" x2="44" y2="25"   stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="35.9" y1="34.5" x2="44" y2="39"   stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="36.5" x2="32" y2="46"   stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="28.1" y1="34.5" x2="20" y2="39"   stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="28.1" y1="29.5" x2="20" y2="25"   stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Center node -->
  <circle cx="32" cy="32" r="4.5" fill="#3b82f6"/>
  <circle cx="32" cy="32" r="2"   fill="#93c5fd"/>

  <!-- Inner hex vertex dots (devices) -->
  <circle cx="32" cy="18" r="2.5" fill="#10b981"/>
  <circle cx="44" cy="25" r="2.5" fill="#10b981"/>
  <circle cx="44" cy="39" r="2.5" fill="#06b6d4"/>
  <circle cx="32" cy="46" r="2.5" fill="#10b981"/>
  <circle cx="20" cy="39" r="2.5" fill="#06b6d4"/>
  <circle cx="20" cy="25" r="2.5" fill="#10b981"/>

  <!-- Faint propagation lines inner → outer -->
  <line x1="32" y1="18" x2="32" y2="6"   stroke="#3b82f6" stroke-width="1" opacity="0.5" stroke-linecap="round"/>
  <line x1="44" y1="25" x2="54" y2="19"  stroke="#3b82f6" stroke-width="1" opacity="0.5" stroke-linecap="round"/>
  <line x1="44" y1="39" x2="54" y2="45"  stroke="#3b82f6" stroke-width="1" opacity="0.5" stroke-linecap="round"/>
  <line x1="32" y1="46" x2="32" y2="58"  stroke="#3b82f6" stroke-width="1" opacity="0.5" stroke-linecap="round"/>
  <line x1="20" y1="39" x2="10" y2="45"  stroke="#3b82f6" stroke-width="1" opacity="0.5" stroke-linecap="round"/>
  <line x1="20" y1="25" x2="10" y2="19"  stroke="#3b82f6" stroke-width="1" opacity="0.5" stroke-linecap="round"/>

  <!-- Outer hex vertex dots (signal endpoints) -->
  <circle cx="32" cy="6"  r="2" fill="#3b82f6" opacity="0.7"/>
  <circle cx="54" cy="19" r="2" fill="#3b82f6" opacity="0.7"/>
  <circle cx="54" cy="45" r="2" fill="#3b82f6" opacity="0.7"/>
  <circle cx="32" cy="58" r="2" fill="#3b82f6" opacity="0.7"/>
  <circle cx="10" cy="45" r="2" fill="#3b82f6" opacity="0.7"/>
  <circle cx="10" cy="19" r="2" fill="#3b82f6" opacity="0.7"/>
</svg>
